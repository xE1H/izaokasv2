name: Publish the SDK fingerprint

# The leaderboard ranks a lap only if the fingerprint sent with it is the one
# the competition is being run on.  That makes "the current fingerprint" a
# thing someone has to keep up to date, and a thing that is wrong in exactly
# the worst way if they forget: every team's submissions stop being ranked
# until someone notices.
#
# So it is not kept by hand.  Every push to the SDK on upstream's main
# recomputes the fingerprint and tells the board about it, which means the
# board is gating on whatever teams get from `git pull` — by construction.

on:
  push:
    branches: [main]
    paths:
      - "lituanicax_sdk/**"
  workflow_dispatch:

jobs:
  publish:
    # Only upstream defines the official SDK.  A team's fork pushing its own
    # fingerprint is exactly what the gate exists to prevent.
    if: github.repository == 'MCiuzelis/LituanicaX_IsaacSimChallenge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute the fingerprint
        id: fingerprint
        run: |
          # Load _locked.py on its own rather than importing the package:
          # lituanicax_sdk/__init__.py pulls in gymnasium and torch, and the
          # hashing itself needs nothing outside the standard library.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util, os

          spec = importlib.util.spec_from_file_location(
              "_locked", "lituanicax_sdk/_locked.py"
          )
          locked = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(locked)

          changed = locked.verify_integrity(quiet=True)
          if changed:
              raise SystemExit(
                  "manifest.json is stale — run write_manifest() and commit it. "
                  f"Out of date: {', '.join(changed)}"
              )

          print(f"value={locked.sdk_fingerprint()}")
          PY

      - name: Tell the leaderboard
        env:
          URL: ${{ secrets.LEADERBOARD_URL }}
          ADMIN_TOKEN: ${{ secrets.LEADERBOARD_ADMIN_TOKEN }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          if [ -z "$URL" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "::notice::LEADERBOARD_URL / LEADERBOARD_ADMIN_TOKEN are not set;"
            echo "::notice::the fingerprint is $FINGERPRINT — set it by hand."
            exit 0
          fi

          status=$(curl --silent --show-error --output /tmp/response.json \
            --write-out '%{http_code}' --max-time 30 \
            -X POST "${URL%/}/api/admin/sdk-hash" \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            -d "{\"fingerprint\": \"${FINGERPRINT}\", \"note\": \"${GITHUB_SHA}\"}")

          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "::error::The board answered ${status}. Laps will keep being"
            echo "::error::ranked against the previous fingerprint until this works."
            exit 1
          fi
          echo "::notice::The leaderboard now ranks against ${FINGERPRINT}."
