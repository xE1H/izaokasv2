name: SDK guard

# Two checks, both cheap:
#   1. the SDK matches the official one — it defines the car and the lap clock,
#      so a change here means this branch's lap times cannot be compared with
#      other teams';
#   2. the tests still pass, which needs no GPU and no Isaac Sim.

on: [push, pull_request]

jobs:
  sdk-unchanged:
    # The baseline is upstream, so this job would fail on every commit that
    # develops the SDK.  Run it only in a team's own clone of the repository.
    if: github.repository != 'MCiuzelis/LituanicaX_IsaacSimChallenge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check lituanicax_sdk/ matches upstream
        run: |
          git remote add upstream https://github.com/MCiuzelis/LituanicaX_IsaacSimChallenge.git
          git fetch --quiet upstream main

          # Compare against the point this branch left upstream, not against
          # upstream's tip: a branch that is merely out of date has not
          # modified anything.  (Being out of date is a separate concern —
          # lituanicax_sdk/manifest.json records which SDK a lap time was set
          # under.)
          base=$(git merge-base upstream/main HEAD || echo upstream/main)

          changed=$(git diff --name-only "$base" HEAD -- lituanicax_sdk/)
          if [ -n "$changed" ]; then
            echo "::error::The SDK was modified. Lap times from this branch are"
            echo "::error::not comparable with other teams'. Files changed:"
            echo "$changed"
            exit 1
          fi
          echo "SDK unchanged (baseline $base)."

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The SDK's own tests need only torch and pytest — no Isaac Sim, no GPU.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pytest gymnasium
      - run: python -m pytest tests/ -q
