[build-system]
requires = ["setuptools<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lituanicax-irc"
version = "0.1.0"
description = "RL training environment for the LituanicaX intelligent robot competition."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "setuptools<82.0.0",
    "isaacsim[all,extscache]==5.1.0",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "tensordict",
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_tasks",
    "isaaclab_rl[rsl-rl]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lituanicax_sdk*", "teamcode*"]

[tool.setuptools.package-data]
# The car, and the official track's meshes and centerline, ship with the SDK.
lituanicax_sdk = ["assets/*", "tracks/**/*", "manifest.json"]

# ── Linting / formatting (ruff) ───────────────────────────────────────────
# Your editor will pick these up automatically, so it stops flagging things
# that are deliberate.
[tool.pytest.ini_options]
# The repo root goes on sys.path, so `pytest` finds lituanicax_sdk whichever
# directory you run it from.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = ["IsaacLab", ".venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# These must start Isaac Sim before importing anything that depends on it, so
# their imports genuinely cannot all sit at the top.
"teamcode/train.py" = ["E402"]
"teamcode/play.py" = ["E402"]
"lituanicax_sdk/benchmark.py" = ["E402"]
"tools/probe.py" = ["E402"]
"tools/determinism.py" = ["E402"]
"teacher/optimize.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["lituanicax_sdk", "teamcode", "teacher", "tools"]

# ── Type checking (pyright / Pylance) ─────────────────────────────────────
# Isaac Lab is installed *editable*, which pip implements with an import hook
# that only exists at runtime.  Your editor cannot follow it, so without the
# extraPaths below every `import isaaclab...` is underlined red and you lose
# autocomplete on the one API you use most.  Pointing straight at the sources
# in the submodule fixes both.
#
# `omni` and `pxr` are deliberately absent: they are Isaac Sim's Kit
# extensions, and they genuinely do not exist until the simulator is running.
# The handful of imports of them are marked at their import site instead.
#
# typeCheckingMode is pinned rather than left at the default because
# basedpyright — Zed's out-of-the-box Python server — defaults to a much
# stricter "recommended" mode, and Isaac Lab and torch are unannotated enough
# that it buries real problems under thousands of reportUnknown* warnings.
# This repository is kept clean at "standard"; .zed/settings.json also selects
# plain pyright.
[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    "IsaacLab/source/isaaclab",
    "IsaacLab/source/isaaclab_assets",
    "IsaacLab/source/isaaclab_rl",
    "IsaacLab/source/isaaclab_tasks",
]
exclude = ["IsaacLab", ".venv", "logs", "**/__pycache__"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64' and python_full_version == '3.11.*'"]

[tool.uv.sources]
isaacsim = { index = "nvidia" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
isaaclab = { path = "IsaacLab/source/isaaclab", editable = true }
isaaclab_assets = { path = "IsaacLab/source/isaaclab_assets", editable = true }
isaaclab_tasks = { path = "IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab_rl = { path = "IsaacLab/source/isaaclab_rl", editable = true }

[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<82"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false
